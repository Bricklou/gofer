# Example Docker Compose setup. See docs/setup.md for the details.
#
#   docker compose up -d
#   docker compose logs gofer   # shows the first-run setup token

services:
  gofer:
    image: ghcr.io/cristianadrielbraun/gofer:latest
    # To build the image from this checkout instead:
    # build: .
    container_name: gofer
    restart: unless-stopped
    ports:
      # Reachable only from this machine, for a reverse proxy running here.
      # Use "8090:8090" to reach Gofer from other machines.
      - "127.0.0.1:8090:8090"
    environment:
      # The address people open in their browser.
      GOFER_BASE_URL: https://mail.example.com
      # personal (the default) or managed. See .env.example for all options.
      # GOFER_AUTH_MODE: managed
      # A reverse proxy on this machine reaches Gofer through the Docker
      # network gateway. Trust it to pass the real client address.
      # GOFER_TRUSTED_PROXY_CIDRS: 172.16.0.0/12
      # Plain HTTP on a private network address, such as
      # GOFER_BASE_URL=http://192.168.0.10:8090. Sign-in cookies then travel
      # unencrypted on that network.
      # GOFER_ALLOW_INSECURE_LAN: "true"
    # Further settings, such as OAuth clients, can come from a file.
    # env_file: .env
    volumes:
      - gofer-data:/data

volumes:
  gofer-data:
